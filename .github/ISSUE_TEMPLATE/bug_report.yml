name: Bug report
description: Report a capture, conversion, or save issue in Paper Clipper.
title: "BUG: "
labels: ["bug"]
body:
  - type: dropdown
    id: route
    attributes:
      label: Workflow / entry point
      options:
        - Chrome extension — save folder / ZIP
        - Chrome extension — paired browser queue
        - CLI — save-paper / clip
        - Paper Clipper Core
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Paper Clipper version
      placeholder: e.g. 1.7.7
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and browser / Node.js version
      placeholder: e.g. Windows 11, Chrome 131 / Node 24
    validations:
      required: true

  - type: textarea
    id: article
    attributes:
      label: Public article URL or DOI
      description: Omit private or signed URLs, article content, and pairing keys.
      placeholder: e.g. 10.1186/s13045-021-01131-0 or https://...
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the capture, conversion, or save failure and how to reproduce it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Error message or checks.json excerpt
      description: Optional diagnostic output, report status, or screenshot details (without private URLs or keys).
    validations:
      required: false
