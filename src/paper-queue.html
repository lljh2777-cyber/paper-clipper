<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Paper Clipper | Browser Queue</title>
	<link rel="icon" href="icons/icon48.png">
	<link rel="stylesheet" href="paper-queue.css">
	<script src="paper-queue.js" defer></script>
</head>
<body>
	<header><img src="icons/paper-clipper.svg" width="32" height="32" alt=""><h1>Paper Clipper</h1><span>Browser queue</span><span id="connection" role="status">Disconnected</span></header>
	<main>
		<form id="pairing">
			<button type="submit"><i data-lucide="link"></i>Connect</button>
			<button id="disconnect" type="button" title="Disconnect" aria-label="Disconnect"><i data-lucide="unplug"></i></button>
			<span id="pair-code" role="status" hidden></span>
			<details id="advanced-pairing"><summary>Advanced</summary><div class="pairing-fields">
				<label>Local endpoint<input id="endpoint" type="url" value="http://127.0.0.1:43127" required></label>
				<label>Manual pairing key<input id="key" type="password" autocomplete="off"></label>
			</div></details>
		</form>
		<div class="toolbar"><h2>Tasks <span id="count">0</span></h2><div class="actions"><button id="reset-pairing" type="button"><i data-lucide="rotate-cw"></i>Reset pairing</button><button id="forget" type="button">Forget pairing</button></div></div>
		<p id="pairing-notice" role="status" hidden></p>
		<p id="error" role="alert" hidden></p>
		<section id="jobs" aria-label="Paper tasks"><p class="empty">No tasks</p></section>
	</main>
</body>
</html>
