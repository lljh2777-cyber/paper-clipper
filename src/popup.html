<!DOCTYPE html>
<html id="popup">
	<head>
		<title data-i18n="extensionName">Paper Clipper</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link rel="stylesheet" href="style.css">
		<script src="browser-polyfill.min.js"></script>
	</head>
	<body id="popup-container">
		<div class="paper-brand">
			<img src="icons/paper-clipper.svg" width="20" height="20" alt=""><span>Paper Clipper</span>
			<a class="paper-feedback" target="_blank" rel="noopener noreferrer">
				<i data-lucide="message-circle" aria-hidden="true"></i><span data-i18n="feedback">Feedback</span>
			</a>
		</div>
		<div id="popup-header">
			<div id="template-container">
				<select id="template-select">
					<option value=""></option>
				</select>
			</div>
			<div class="popup-actions">
				<a href="paper-queue.html" target="_blank" class="clickable-icon" title="Paper queue" aria-label="Paper queue"><i data-lucide="clipboard-list"></i></a>
				<a href="paper-library.html" target="_blank" class="clickable-icon" data-i18n-title="paperLibrary" aria-label="Archives"><i data-lucide="archive"></i></a>
				<button type="button" id="export-page-html" class="clickable-icon" data-i18n-title="exportPageHtml" aria-label="Export page HTML" disabled>
					<i data-lucide="file-down"></i>
				</button>
				<a href="#" id="show-variables" class="clickable-icon" 
					data-i18n-title="showPageVariables">
					<i data-lucide="ellipsis"></i>
				</a>
				<a href="#" id="highlighter-mode" class="clickable-icon"
					data-i18n-title="highlightPage">
					<i data-lucide="highlighter"></i>
				</a>
				<a href="#" id="reader-mode" class="clickable-icon"
					data-i18n-title="reader">
					<i data-lucide="book-open"></i>
				</a>
				<a href="#" id="embedded-mode" class="clickable-icon" 
					data-i18n-title="openEmbedded">
					<i data-lucide="picture-in-picture-2"></i>
				</a>
				<a href="#" id="open-settings" class="clickable-icon" 
					data-i18n-title="settings">
					<i data-lucide="settings"></i>
				</a>		
			</div>
		</div>
		<p id="html-export-status" role="status" hidden></p>
		<p class="error-message" style="display: none;"></p>
		<div class="clipper">
			<textarea id="note-name-field" type="text" data-i18n="noteName" rows="1"></textarea>
			<div class="metadata-properties-header">
				<span data-i18n="properties"></span>
				<i data-lucide="chevron-down"></i>
			</div>
			<div class="metadata-properties"></div>
			<div id="note-content-container">
				<textarea id="note-content-field" rows="4" data-i18n="notesAboutPage"></textarea>
			</div>
			<div class="clipper-footer">
				<label class="paper-destination"><span data-i18n="paperUseDefaultFolder">Use default folder</span>
					<span class="checkbox-container mod-small"><input type="checkbox" role="switch" id="use-default-paper-directory" checked></span>
				</label>
				<div class="action-buttons" id="action-buttons">
					<button id="clip-btn" class="mod-cta"><!-- Text set by determineMainAction --></button>
					<div class="menu-btn">
						<button id="more-btn"><i data-lucide="chevron-down"></i></button>
						<div class="menu" id="more-dropdown">
							<div class="secondary-actions">
								<!-- Secondary actions will be populated by ts -->
							</div>
						</div>
					</div>
					<div class="share-btn">
						<a class="share-content clickable-icon" data-i18n-title="share"><i data-lucide="share"></i></a>
					</div>
				</div>
				<div id="paper-save-methods" role="status"></div>
				<details id="paper-save-details" hidden>
					<summary data-i18n="paperSaveDetails"></summary>
					<div id="image-archive-status" role="status"></div>
				</details>
			</div>
		</div>
		<script type="module" src="popup.js"></script>
	</body>
</html>
